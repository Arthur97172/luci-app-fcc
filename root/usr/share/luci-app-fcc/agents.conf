# luci-app-fcc — Agent registry (single source of truth)
#
# Format: id|Friendly Name|launcher|default_install|approx_size_mb|min_ram_mb|probe
#
#   id              Stable internal agent id. Used in UCI, session names and API
#                   parameters. Lowercase alphanumeric only.
#   Friendly Name   Display name in the UI.
#   launcher        FCC console-script launcher, verified against the upstream
#                   free-claude-code pyproject.toml [project.scripts] table.
#   default_install Upstream installer default (1 = installed by default).
#   approx_size_mb  Rough footprint hint for low-resource default selection.
#   min_ram_mb      Rough RAM hint for the same purpose.
#   probe           OPTIONAL underlying CLI used for *safe* version detection.
#                   NEVER put an fcc-* launcher here: those are launchers and
#                   would START the agent. Leave empty when the underlying CLI
#                   is unknown or unsafe to run (e.g. `hermes --version` hangs).
#
# Note what `probe` is NOT used for. Whether an agent is installed is decided by
# the `id`, which is the command name upstream's own installer probes
# (`find_installed_coding_agent`), searched under the runtime root and then on
# PATH. So `hermes` is answerable even though its probe is empty: asking whether
# a command exists does not run it, and the id is the name that exists.
#
# The `id` is also not the launcher. `uv tool install free-claude-code` writes
# all seventeen fcc-* launchers at once, so a launcher being present says only
# that the runtime is installed — never put one in the id column either.
#
# This file is a *hint*; real state is always detected dynamically against the
# actual executables by /usr/libexec/fcc/status.sh.
#
# Launchers taken from the current upstream pyproject.toml:
#   fcc-server, fcc-doctor, fcc-claude, fcc-codex, fcc-pi, fcc-opencode,
#   fcc-cline, fcc-hermes, fcc-dsh, fcc-grok, fcc-muse, fcc-aider, fcc-agy
# DeepSeek Harness is "fcc-dsh" — never invent "fcc-deepseek".
#
# Antigravity CLI is the newest of them and the only one whose underlying
# command (`agy`) shares no prefix with its launcher (`fcc-agy`). Its id is
# still `agy`, because that is the command upstream's own installer probes to
# decide whether the agent is present — and `agy --version` answers without
# starting an interactive session, so it is also its probe.
claude|Claude Code|fcc-claude|1|140|180|claude
codex|Codex|fcc-codex|1|120|160|codex
pi|Pi|fcc-pi|1|90|140|pi
opencode|OpenCode|fcc-opencode|1|110|160|opencode
cline|Cline|fcc-cline|0|100|150|cline
hermes|Hermes|fcc-hermes|1|90|140|
dsh|DeepSeek Harness|fcc-dsh|1|130|180|dsh
grok|Grok Build|fcc-grok|1|100|150|grok
muse|Muse Code|fcc-muse|1|100|150|muse
aider|Aider|fcc-aider|1|80|130|aider
agy|Antigravity CLI|fcc-agy|1|210|160|agy
