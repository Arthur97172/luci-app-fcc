# luci-app-fcc — CI build.
#
# DESIGN_SPEC.md section 15 requires CI to produce both an OpenWrt 24.10 .ipk
# and an OpenWrt 25.12 .apk, and sections 90 and 91 require each of them to be
# installed with the release's own package manager and followed by
# `/etc/init.d/fcc status`. The matrix below covers exactly that: one SDK per
# release, and one install of each release's package in its own rootfs.
#
# Only x86_64 is built. The package is PKGARCH:=all — it ships only Lua,
# JavaScript and ash — so the aarch64 SDK compiled the same dependency chain a
# second time and produced the same package, and the aarch64 rootfs leg
# installed that same payload through qemu. That dimension was dropped on
# 2026-10-21 as redundant work, not because the package stopped supporting
# those systems: the artifact is architecture-independent and installs on ARM,
# MIPS and x86 alike. Sections 61 and 92 still list aarch64 in the matrix;
# DESIGN_SPEC.md is the specification and is not edited here, so this is the
# one place the two disagree.
#
# A push to main also publishes a GitHub release (section 62), named after the
# version in ./VERSION and the Makefile's PKG_RELEASE. There is no tag to push
# and none to get wrong: the workflow creates the tag itself, so the release,
# its tag and the packages under it are one string from one source.
#
# --- why the official SDK tarball and not a container ------------------------
#
# This job used to run openwrt/gh-action-sdk against the openwrt/sdk image. That
# image is not an SDK: /builder/setup.sh in it downloads an *Image Builder*
# (DOWNLOAD_FILE defaults to "imagebuilder-.*x86_64.tar.[xz|zst]"), whose
# .config carries CONFIG_ALL=y, CONFIG_ALL_KMODS=y and CONFIG_ALL_NONSHARED=y.
# A bare `make` there therefore builds the entire package universe — LLVM,
# erlang, dbus, glib — which is why every matrix entry used to sit at the
# 60-minute ceiling and get cancelled rather than finish.
#
# downloads.openwrt.org ships real SDKs: the tarball contains a prebuilt
# toolchain under staging_dir/toolchain-*, so only our package and its declared
# dependencies compile. Measured on the 24.10 x86-64 SDK: 91s to download
# 246MB, 2s to extract, and about two minutes to build luci-app-fcc together
# with luci-base and the rest of its dependency chain. The package itself
# compiles in under two seconds.
#
# The releases are pinned to point releases, not to -SNAPSHOT, so a green run
# means the same thing next month.

name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialise runs for the same ref rather than cancelling them. Two runs racing
# to delete and recreate the same tag would collide, and a run cancelled
# between the delete and the publish leaves the release missing entirely — so
# the newer push waits for the older one to finish instead of taking its place.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # The gate. Nothing is built until the package is known to be well-formed and
  # to still obey the specification.
  # ---------------------------------------------------------------------------
  check:
    name: Static checks
    runs-on: ubuntu-latest
    # Bounded so a hung test fails the gate instead of occupying a runner until
    # GitHub's six-hour ceiling. The suite takes well under a minute.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install test tooling
        # luac for the Lua syntax check; python3 and jq are already present on
        # the runner and cover the JSON check. po2lmo is deliberately absent —
        # it comes from luci-base/host and the i18n suite falls back to
        # structural checks when it is missing.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1

      - name: Run the check suite
        # The suite prints every failed check, but a run's log is readable only
        # by someone signed in. Repeating the failure lines as annotations puts
        # them on the run page and in the checks API, which is public — a red
        # run can then be diagnosed without downloading the log.
        #
        # A step may raise ten annotations, so the first ten are sent and the
        # rest are counted; ten failing checks are enough to name the suite.
        run: |
          if sh scripts/test.sh >"$RUNNER_TEMP/check.log" 2>&1; then
            cat "$RUNNER_TEMP/check.log"
            exit 0
          fi
          cat "$RUNNER_TEMP/check.log"
          grep -E '^    FAIL|^failed checks:|^[0-9]+ of [0-9]+ suites FAILED' \
            "$RUNNER_TEMP/check.log" >"$RUNNER_TEMP/failures.txt" || true
          head -10 "$RUNNER_TEMP/failures.txt" \
            | while IFS= read -r line; do
                printf '::error::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g')"
              done
          n=$(wc -l <"$RUNNER_TEMP/failures.txt")
          if [ "$n" -gt 10 ]; then
            printf '::error::%d more failing checks are in the log\n' "$((n - 10))"
          fi
          exit 1

  # ---------------------------------------------------------------------------
  # Build matrix (section 61).
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.release }} / ${{ matrix.arch }}
    needs: check
    runs-on: ubuntu-latest
    # A real build is a 91s download plus roughly two minutes of compiling. The
    # bound is generous enough for a cold cache on a slow runner and tight
    # enough that a stall goes red well before GitHub's ceiling.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # One entry per packaging format, which is the only thing that differs
      # between them: 24.10 writes an opkg .ipk, 25.12 an apk .apk. The SDK's
      # target does not reach the artifact — PKGARCH:=all — so a second
      # architecture would only repeat this work.
      matrix:
        include:
          - release: '24.10.8'
            arch: x86_64
            target: x86/64
            sdk: openwrt-sdk-24.10.8-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            ext: ipk
          - release: '25.12.6'
            arch: x86_64
            target: x86/64
            sdk: openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ext: apk

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host tooling
        # zstd unpacks the SDK tarballs. gawk is not a nicety: the SDK's
        # prerequisite check greps the output of `awk --version` for "GNU", and
        # Ubuntu's /usr/bin/awk is mawk, which does not print it. Without gawk
        # the run stops at "Please install GNU 'awk'" before compiling
        # anything — and because scripts/feeds runs the same check internally
        # through `make prepare-tmpinfo`, gawk has to be present before the
        # feeds are set up, not merely before the compile.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd gawk

      - name: Cache the SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: sdk.tar.zst
          key: ${{ matrix.sdk }}

      - name: Download the SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          set -eu
          url="https://downloads.openwrt.org/releases/${{ matrix.release }}/targets/${{ matrix.target }}/${{ matrix.sdk }}"
          echo "fetching $url"
          curl -fsSL --retry 3 --retry-delay 5 -o sdk.tar.zst "$url"
          ls -l sdk.tar.zst

      - name: Extract the SDK
        # Unpacked outside the workspace on purpose. The package Makefile lives
        # at the repository root, so the src-link feed has to point at the
        # checkout itself; an SDK unpacked *inside* the checkout is then part of
        # what the feed scan walks, and its package/toolchain directory gets
        # picked up as a package of ours. $RUNNER_TEMP is outside, and is
        # already the conventional scratch area.
        run: |
          set -eu
          echo "SDK_DIR=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/sdk"
          tar --zstd -xf sdk.tar.zst -C "$RUNNER_TEMP/sdk" --strip-components=1
          test -d "$RUNNER_TEMP/sdk/staging_dir"
          test -x "$RUNNER_TEMP/sdk/scripts/feeds"
          # The toolchain is what makes this an SDK and not an Image Builder.
          # Without it the build silently falls back to building everything.
          ls -d "$RUNNER_TEMP/sdk"/staging_dir/toolchain-*

      - name: Configure feeds
        run: |
          set -eu
          cd "$SDK_DIR"
          # feeds.conf.default pins the luci feed to the commit this SDK release
          # was built against; keeping it is what makes luci-base/host (po2lmo)
          # available below.
          cp feeds.conf.default feeds.conf
          # A src-link feed is scanned for <pkgname>/Makefile, and this package
          # keeps its Makefile at the repository root, so the feed root needs a
          # directory named after the package pointing back at the checkout.
          mkdir -p "$GITHUB_WORKSPACE/feedroot"
          ln -sfn "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/feedroot/luci-app-fcc"
          echo "src-link fcc $GITHUB_WORKSPACE/feedroot" >> feeds.conf
          cat feeds.conf

      - name: Update feeds
        run: |
          set -eu
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -p fcc -a
          # luci-base is a build dependency of our package
          # (PKG_BUILD_DEPENDS:=luci-base/host) but it is not part of our feed,
          # so install it explicitly rather than relying on the build system to
          # discover it.
          ./scripts/feeds install luci-base

      - name: Configure the build
        run: |
          set -eu
          cd "$SDK_DIR"
          # The SDK ships no .config, so this step used to start by rewriting a
          # file that was not there and died on the first grep. The three
          # overrides are therefore written first, and `make defconfig` then
          # fills in everything else around them.
          #
          # They are written first for a second reason: the SDK's Config.in has
          # `config ALL` with a bare `default y` ("Select all userspace packages
          # by default"), and defconfig keeps values already present in .config.
          # Seeding ALL=n before the first defconfig is what stops the config
          # from selecting the entire package universe — kmods included, which
          # drags in package/kernel/linux and a full kernel compile. That is the
          # same trap as the Image Builder, one layer down. ALL_KMODS and
          # ALL_NONSHARED both default to ALL, so all three are seeded.
          #
          # Selecting the package is not optional either. `make
          # package/luci-app-fcc/compile` builds the package only when
          # CONFIG_PACKAGE_luci-app-fcc is set; otherwise include/package.mk
          # defines `compile` as the autoremove stub alone, which cleans the
          # build directory and produces nothing. The dependency chain still
          # builds, so without this line the job collects a dist/ full of
          # libraries and a green run ships no package of ours at all.
          #
          # The translation is a package of its own and is selected the same way,
          # for the same reason: without CONFIG_PACKAGE_luci-i18n-fcc-zh-cn=y the
          # compile target is the autoremove stub and no .lmo is ever built.
          printf 'CONFIG_ALL=n\nCONFIG_ALL_KMODS=n\nCONFIG_ALL_NONSHARED=n\nCONFIG_PACKAGE_luci-app-fcc=y\nCONFIG_PACKAGE_luci-i18n-fcc-zh-cn=y\n' > .config
          make defconfig
          # Fail loudly if the defaults came back: a silent return to ALL would
          # turn this job into a kernel build rather than a package build.
          ! grep -qE '^CONFIG_(ALL|ALL_KMODS|ALL_NONSHARED)=y' .config
          test "$(grep -cE '^CONFIG_PACKAGE_luci-app-fcc=y' .config)" = 1
          test "$(grep -cE '^CONFIG_PACKAGE_luci-i18n-fcc-zh-cn=y' .config)" = 1
          echo "kmods selected: $(grep -cE '^CONFIG_PACKAGE_kmod.*=y' .config)"

      - name: Build luci-base host tools
        # The released SDK ships no po2lmo — it has no tools/ tree, and the 324
        # host tools in staging_dir/host/bin do not include it. luci-base builds
        # it as a HostBuild into staging_dir/hostpkg/bin, which is what a full
        # buildroot does and what turns our po/zh_Hans/fcc.po into the .lmo that
        # ships inside luci-i18n-fcc-zh-cn. It takes about a second.
        run: |
          set -eu
          cd "$SDK_DIR"
          make package/luci-base/host/compile V=s
          test -x staging_dir/hostpkg/bin/po2lmo
          staging_dir/hostpkg/bin/po2lmo 2>&1 | head -1 || true

      - name: Build the packages
        # One target, both packages. `package/<name>/compile` is aliased by
        # *directory* name — subdir.mk's diralias takes the last path segment of
        # feeds/fcc/luci-app-fcc — so there is no
        # `package/luci-i18n-fcc-zh-cn/compile` and asking for one fails with
        # "No rule to make target". The two CONFIG_PACKAGE_…=y lines above are
        # what decide which of the Makefile's BuildPackage entries produce
        # output.
        run: |
          set -eu
          cd "$SDK_DIR"
          make package/luci-app-fcc/compile V=s

      - name: Collect artifacts
        run: |
          set -eu
          mkdir -p dist
          # Only this project's packages. Building luci-app-fcc builds its whole
          # dependency chain alongside it — luci-base, curl, tmux, lua and about
          # sixty others — and copying bin/packages wholesale put every one of
          # those into the artifact, and from there into a release that sections
          # 62 and 93 say carries luci-app-fcc. Publishing other projects'
          # packages under our name is wrong however convenient the glob is.
          #
          # The smoke job does not need them: it installs the built package and
          # resolves its dependencies from the release's own feed.
          #
          # The feed name is the directory the SDK writes into, so glob the
          # extension across bin/packages rather than guessing the arch path.
          for _vi_p in 'luci-app-fcc' 'luci-i18n-fcc'; do
            find "$SDK_DIR/bin/packages" -name "$_vi_p[-_]*.${{ matrix.ext }}" \
              -exec cp -v {} dist/ \;
          done
          # Assert on each by name. What this catches is a build that produced no
          # package of ours at all because the config never selected it — the
          # dependency chain still builds in that case, so "dist is non-empty"
          # would say nothing. Both are named because a release that carried only
          # the app would be one with no Chinese interface in it.
          for _vi_p in 'luci-app-fcc' 'luci-i18n-fcc'; do
            ls dist/"$_vi_p"[-_]*.${{ matrix.ext }} >/dev/null 2>&1 || {
              echo "::error::$_vi_p was not built"
              find "$SDK_DIR/bin/packages" -maxdepth 3 -type d
              exit 1
            }
          done
          ls -l dist

      - name: Verify the artifacts
        # The static half of the install check: what we are about to publish
        # really does contain the package. Installing on a real system is the
        # smoke job's business (sections 90 and 91).
        #
        # What it catches is the failure that matters here: a package that
        # builds but ships nothing, one whose .lmo never got compiled because
        # po2lmo was absent, or a build that produced no package of ours at all
        # because the config never selected it.
        #
        # The checks are per package, not per extension: asserting the
        # controller inside every file would fail the translation package, which
        # correctly contains only the catalogue.
        run: |
          set -eu
          DIST="$PWD/dist"
          EXT='${{ matrix.ext }}'
          APK="$SDK_DIR/staging_dir/host/bin/apk"
          fail=0

          # An .ipk is a tar holding control.tar.gz and data.tar.gz. Unpacking
          # both is safe: neither is executed.
          unpack_ipk() {
            _vi_d="$(mktemp -d)"
            tar -C "$_vi_d" -xzf "$DIST/$1"
            tar -C "$_vi_d" -xzf "$_vi_d/data.tar.gz"
            printf '%s' "$_vi_d"
          }

          # An .apk on 25.12 is not a tar at all. apk-tools 3 writes the ADB
          # container, and `tar -tzf` rejects it outright with "not in gzip
          # format" — which is how the previous version of this step would have
          # failed every 25.12 run. The SDK's own apk binary is the one thing
          # here that can read it. --allow-untrusted because the package is
          # signed with a key this runner has no reason to hold; the payload is
          # what is being checked, and the smoke job does the real install.
          unpack_apk() {
            _vi_d="$(mktemp -d)"
            ( cd "$_vi_d" && "$APK" extract --allow-untrusted "$DIST/$1" >/dev/null )
            printf '%s' "$_vi_d"
          }

          unpack() {
            case "$1" in
              *.ipk) unpack_ipk "$1" ;;
              *.apk) unpack_apk "$1" ;;
              *) echo "::error::$1 is neither an .ipk nor an .apk"; return 1 ;;
            esac
          }

          if [ "$EXT" = apk ]; then
            test -x "$APK" || { echo "::error::the SDK ships no apk tool at $APK"; exit 1; }
          fi

          # A glob that matches nothing expands to itself, so a loop over it
          # would run once on a literal pattern and — with an `[ -e ] ||
          # continue` guard — pass without having checked anything. Resolve the
          # matches first and insist on at least one.
          app="$(ls -1 "$DIST"/luci-app-fcc[-_]*."$EXT" 2>/dev/null || true)"
          [ -n "$app" ] || { echo "::error::no luci-app-fcc package in dist"; fail=1; }

          for f in $app; do
            d="$(unpack "$(basename "$f")")"
            test -f "$d/usr/lib/lua/luci/controller/fcc.lua" \
              || { echo "::error::$f is missing the controller"; fail=1; }
            test -d "$d/usr/lib/lua/luci/view/fcc" \
              || { echo "::error::$f is missing the views"; fail=1; }
            test -f "$d/usr/libexec/fcc/session.sh" \
              || { echo "::error::$f is missing the backends"; fail=1; }
            # English only. The catalogue belongs to luci-i18n-fcc-zh-cn, and a
            # po2lmo line left behind in this package's install block would ship
            # it twice with nothing else noticing — both packages install and run
            # perfectly well either way.
            test ! -e "$d/usr/lib/lua/luci/i18n/fcc.zh-cn.lmo" \
              || { echo "::error::$f carries the zh-cn catalogue; it belongs in luci-i18n-fcc-zh-cn"; fail=1; }
            rm -rf "$d"
            echo "$(basename "$f"): payload ok"
          done

          # The translation package, which correctly contains only the catalogue.
          # A build where po2lmo was missing — or where its output went somewhere
          # LuCI does not look — has to fail here; nothing else would notice.
          i18n="$(ls -1 "$DIST"/luci-i18n-fcc[-_]*."$EXT" 2>/dev/null || true)"
          [ -n "$i18n" ] || { echo "::error::no luci-i18n-fcc package in dist"; fail=1; }

          for f in $i18n; do
            d="$(unpack "$(basename "$f")")"
            test -f "$d/usr/lib/lua/luci/i18n/fcc.zh-cn.lmo" \
              || { echo "::error::$f carries no compiled zh-cn catalogue"; fail=1; }
            rm -rf "$d"
            echo "$(basename "$f"): payload ok"
          done

          test "$fail" = 0
          echo "artifacts look sane"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-fcc-${{ matrix.release }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Install smoke test (sections 90 and 91).
  #
  # The build job proves the package compiles and contains what it should. This
  # proves it installs: it runs the release's own package manager inside the
  # release's own root filesystem — opkg on 24.10, apk on 25.12 — and then runs
  # the command section 91 names, `/etc/init.d/fcc status`, against a real procd
  # rather than a stand-in.
  #
  # The rootfs is the official one from downloads.openwrt.org for the release
  # the SDK built against, so the feeds the declared dependencies must resolve
  # from are the matching ones.
  #
  # It runs per packaging format, not per architecture: with PKGARCH:=all the
  # aarch64 leg installed the same payload under qemu, so it is gone with the
  # aarch64 build (see the note at the top of this file). What remains is still
  # the check sections 90 and 91 ask for, on both package managers.
  # ---------------------------------------------------------------------------
  smoke:
    name: Install smoke test (${{ matrix.release }} / ${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-latest
    # The rootfs is a few megabytes and the install resolves a dependency chain
    # from the release feed. The bound covers a cold feed on a slow runner.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '24.10.8'
            arch: x86_64
            target: x86/64
            rootfs: openwrt-24.10.8-x86-64-rootfs.tar.gz
            platform: linux/amd64
            ext: ipk
          - release: '25.12.6'
            arch: x86_64
            target: x86/64
            rootfs: openwrt-25.12.6-x86-64-rootfs.tar.gz
            platform: linux/amd64
            ext: apk

    steps:
      - uses: actions/checkout@v4

      - name: Fetch the built packages
        uses: actions/download-artifact@v4
        with:
          name: luci-app-fcc-${{ matrix.release }}-${{ matrix.arch }}
          path: dist

      # No setup-qemu step: it was there for the arm64 rootfs legs, which are
      # gone. Re-adding an aarch64 entry means bringing it back as well.
      - name: Fetch the release rootfs
        run: |
          set -eu
          url="https://downloads.openwrt.org/releases/${{ matrix.release }}/targets/${{ matrix.target }}/${{ matrix.rootfs }}"
          echo "fetching $url"
          curl -fsSL --retry 3 --retry-delay 5 -o rootfs.tar.gz "$url"
          ls -l rootfs.tar.gz
          # --platform is explicit even though it now matches the runner:
          # `docker import` otherwise records the *host's* platform, so an
          # arm64 rootfs imported on an x86_64 runner would be labelled
          # linux/amd64, and running it as linux/arm64 would make Docker look
          # in a registry and fail with "pull access denied for fcc-rootfs" —
          # an error that names neither the platform nor the import. Spelling
          # it out means a re-added aarch64 leg does not depend on remembering
          # that again.
          docker import --platform "${{ matrix.platform }}" \
            rootfs.tar.gz "fcc-rootfs:${{ matrix.release }}"

      - name: Install and check
        run: |
          sh scripts/smoke.sh \
            "fcc-rootfs:${{ matrix.release }}" \
            "${{ matrix.platform }}" \
            "${{ matrix.ext }}" \
            dist

  # ---------------------------------------------------------------------------
  # Release (section 62). A push to main or a manual run publishes; a pull
  # request never does. It runs only after every architecture has built and
  # every one of them has installed cleanly, so a release can never carry a
  # package that does not install.
  #
  # The guard is the pull request alone, and deliberately not `!cancelled()`:
  # that would let this job run when a build or smoke leg had failed, which is
  # the one thing it must never do — a release carrying a package that did not
  # install. `needs` is what enforces the rest.
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [build, smoke]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read the package version
        id: version
        # Section 62: the tag, the release name and the package file name are
        # one string — the release for luci-app-fcc_0.1.1-r2_all.ipk is called
        # 0.1.1-r2 and is tagged 0.1.1-r2. The release number is part of the
        # name because it is part of the version: a rebuilt package keeps
        # VERSION and takes a new PKG_RELEASE, and a name carrying only the
        # first half would put two different packages under one tag.
        #
        # scripts/version.sh composes it from ./VERSION and the Makefile's
        # PKG_RELEASE, which are the two places the version lives — the
        # Makefile stamps the package with them and the app displays the first
        # (section 37). Reading it rather than taking it from the ref is what
        # keeps the release and the packages under it from drifting apart:
        # there is no tag to compare against, because this is the tag.
        run: |
          set -eu
          full="$(sh scripts/version.sh)" || {
            echo "::error::scripts/version.sh could not read the package version"
            exit 1
          }
          echo "PKGVER=$full" >> "$GITHUB_OUTPUT"
          echo "package version: $full"

      - name: Download every artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: luci-app-fcc-*

      - name: Collect the packages
        # Sections 62 and 93: a release carries this package. Each artifact is
        # named after its release and architecture, and PKGARCH=all makes the
        # package itself architecture-independent (section 92), so two
        # artifacts may arrive holding copies of the same file name. They are
        # compared rather than merged: two SDKs disagreeing about the same
        # package is a fact worth failing on, not something to settle by
        # arrival order. The check stays even though only one architecture is
        # built now — it costs nothing and is what would notice if a second was
        # added back and disagreed.
        #
        # The name filter is belt and braces. The build job already collects
        # only our package, but an artifact that somehow carried an upstream
        # one would otherwise be published as if it were ours.
        run: |
          set -eu
          full="${{ steps.version.outputs.PKGVER }}"
          mkdir -p release
          for f in artifacts/*/*; do
            [ -f "$f" ] || continue
            b="$(basename "$f")"
            # Both of our packages. The translation does not begin with
            # "luci-app-fcc", so a filter that named only the app would drop it
            # here — with a warning, into a release that then looked complete.
            case "$b" in
              luci-app-fcc*|luci-i18n-fcc*) : ;;
              *) echo "::warning::not publishing $b"; continue ;;
            esac
            # The version read above says which release this is; the file name
            # is what the build actually produced. Comparing them here is the
            # check that the two agree — a release whose assets are named
            # 0.1.1-r2 while the version says 0.1.2-r2 is a packaging mistake
            # that no other step would catch. The whole string is compared,
            # release number included: 0.1.1-r1 and 0.1.1-r2 are different
            # packages.
            case "$b" in
              *"$full"*) : ;;
              *) echo "::error::$b does not carry version $full"; exit 1 ;;
            esac
            if [ -e "release/$b" ]; then
              cmp -s "$f" "release/$b" || {
                echo "::error::$b differs between the artifacts that carry it"
                sha256sum "$f" "release/$b"
                exit 1
              }
              continue
            fi
            cp "$f" "release/$b"
          done
          ls -l release
          test -n "$(ls -A release)" || {
            echo "::error::no packages to publish"
            find artifacts -maxdepth 2
            exit 1
          }

      - name: Checksums
        run: |
          set -eu
          cd release && sha256sum ./* > SHA256SUMS && cat SHA256SUMS

      - name: Delete any release and tag carrying this version
        # A published release is immutable, so a rerun under the same version
        # has to drop the previous one first. Bumping PKG_RELEASE is a
        # deliberate act, so the same version twice means the same release
        # rebuilt — not a second one — and this makes that rerun idempotent
        # instead of failing on a tag that already exists. `--cleanup-tag`
        # removes the tag with the release; the API call catches a tag that was
        # left behind without one. Both are allowed to find nothing.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ver="${{ steps.version.outputs.PKGVER }}"
          [ -n "$ver" ] || { echo "::error::no version to delete"; exit 1; }
          gh release delete "$ver" -y --cleanup-tag 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$ver" 2>/dev/null || true

      - name: Release notes
        # Section 93 lists what the notes carry: the version, the supported
        # OpenWrt releases, the architectures, the runtime, the agents and the
        # known limitations. The version and the agent list are read from the
        # files that define them, so neither can go stale here — an agent added
        # to agents.conf turns up in the next release's notes with no edit to
        # this step.
        #
        # printf rather than a heredoc: this is markdown and full of backticks,
        # which an unquoted heredoc would run as command substitutions.
        run: |
          set -eu
          ver="${{ steps.version.outputs.PKGVER }}"
          {
            printf '**luci-app-fcc %s**\n\n' "$ver"
            printf '| | |\n| --- | --- |\n'
            printf '| Version | `%s` |\n' "$ver"
            printf '| OpenWrt | 24.10 and earlier — `.ipk` (opkg) · 25.12 and later — `.apk` (apk) |\n'
            printf '| Architecture | `all` — pure Lua, JavaScript and shell, so one artifact fits ARM, x86 and MIPS |\n'
            printf '| Packages | `luci-app-fcc` — the application, English only · `luci-i18n-fcc-zh-cn` — the Simplified Chinese catalogue, install it for a Chinese interface |\n'
            printf '| FCC runtime | not shipped and not pinned — installed on demand from upstream |\n\n'
            printf '**Agents**\n\n'
            awk -F'|' '/^[a-z]/ { printf "- %s (`%s`)\n", $2, $3 }' \
              root/usr/share/luci-app-fcc/agents.conf
            printf '\n**Known limitations**\n\n'
            printf -- '- The console has no WebSocket transport; it long-polls an HTTP byte stream.\n'
            printf -- '- `hermes` has no version probe, so its version reads as unknown.\n'
            printf -- '- Agent versions are probed with a 5-second timeout and cached for 60 seconds.\n'
            printf -- '- The console needs `tmux`; the other two pages do not.\n\n'
            printf 'Install and configuration: see the [README](https://github.com/%s#readme).\n' \
              "$GITHUB_REPOSITORY"
          } > release-notes.md
          cat release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Tag and release name are the same string, and it is the package's
          # version rather than the ref: 0.1.1-r2, carrying
          # luci-app-fcc_0.1.1-r2_all.ipk. Nothing here retypes it.
          #
          # --target is what keeps the tag on the commit these packages were
          # built from. Without it gh tags the default branch's current tip,
          # which on 2026-10-28 put 1.0.6-r8 — built from b4f1ed3 — on the
          # commit of the next push, so checking out that tag gave code the
          # release does not carry. Section 62 wants the tag to name the bytes;
          # GITHUB_SHA is the commit every job in this run checked out.
          ver="${{ steps.version.outputs.PKGVER }}"
          [ -n "$ver" ] || { echo "::error::no version to release"; exit 1; }
          gh release create "$ver" \
            --target "$GITHUB_SHA" \
            --title "$ver" \
            --notes-file release-notes.md \
            release/*
